<!DOCTYPE html>

<head>
<meta charset="UTF-8">

  h1.title {

  .subtitle {

    margin-bottom: 18px;

    margin-top: 10px;

  }
  .fx-shake {
    display: inline-block;
    color: #ff3333;

    text-shadow: 1px 1px 0 #560000;

    40%  { transform: translate(2px,-1px) rotate(3deg); }
    60%  { transform: translate(-1px,-2px) rotate(-2deg); }
    80%  { transform: translate(1px,2px) rotate(2deg); }
    100% { transform: translate(0,0) rotate(0deg); }

  .fx-glow {
    display: inline-block;
    color: #ffe27a;
    animation: glowFx 1.6s ease-in-out infinite;

    0%, 100% { text-shadow: 0 0 4px #ffd166, 0 0 2px #ffd166; color: #ffe27a; }
    50%      { text-shadow: 0 0 12px #56ccf2, 0 0 6px #56ccf2; color: #bdeeff; }

  .fx-fade {
    display: inline-block;
    opacity: 0.45;

  }

    flex-direction: column;
    gap: 10px;
  }
  button.choiceBtn {
    font-family: 'Courier New', Courier, monospace;
    font-weight: bold;
    font-size: 15px;
    background: #2a2d36;
    color: #e8e6df;

    transition: none;

    opacity: 0.35;

</head>
<body>
<div id="app">
  <h1 class="title">WORLD OF LOK'TAR</h1>
  <div class="subtitle">текстовая адвенчура по мотивам чата "Двойное яблоко"</div>

  </div>

<script>
/* ===================== АУДИО ДВИЖОК ===================== */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playBlip(freq, type) {
  try {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.16, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.035);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.045);
  } catch (e) { /* тихо игнорируем, если аудио недоступно */ }
}
let blipCounter = 0;
function voiceBlip(voiceId, ch) {
  if (ch === ' ' || ch === '\n') return;
  blipCounter++;
  if (voiceId === 'mark') {
    if (blipCounter % 3 === 0) playBlip(130, 'square');
  } else if (voiceId === 'drosip') {
    playBlip(450, 'square');
  } else if (voiceId === 'donimazik') {
    playBlip(200 + Math.random() * 150, 'triangle');
  } else {
    playBlip(300, 'triangle');
  }
}

/* ===================== ПАРСЕР ЭФФЕКТОВ ===================== */
function buildTokens(raw) {
  const tokens = [];
  const stack = [];
  let i = 0;
  while (i < raw.length) {
    if (raw[i] === '[') {
      const close = raw.indexOf(']', i);
      if (close !== -1) {
        const tag = raw.slice(i + 1, close);
        if (/^\/?(shake|glow|fade)$/.test(tag)) {
          if (tag[0] === '/') stack.pop();
          else stack.push('fx-' + tag);
          i = close + 1;
          continue;
        }
      }
    }
    tokens.push({ ch: raw[i], cls: stack.slice() });
    i++;
  }
  return tokens;
}

/* ===================== ТЕКСТОВЫЙ ДВИЖОК ===================== */
let typingTimer = null;
let typingTokens = null;
let typingIndex = 0;
let typingVoice = 'narrator';
let isTyping = false;

function resolveVoice(voiceKey) {
  if (voiceKey === 'hero') return HEROES[state.heroId].voice;
  return 'narrator';
}

function startTyping(rawText, voiceKey) {
  const storyText = document.getElementById('storyText');
  storyText.innerHTML = '';
  typingTokens = buildTokens(rawText);
  typingIndex = 0;
  typingVoice = resolveVoice(voiceKey);
  isTyping = true;
  blipCounter = 0;
  setChoicesEnabled(false);
  clearInterval(typingTimer);
  typingTimer = setInterval(typeStep, 34);
}

function typeStep() {
  const storyText = document.getElementById('storyText');
  if (typingIndex >= typingTokens.length) {
    finishTyping();
    return;
  }
  const t = typingTokens[typingIndex];
  appendToken(storyText, t);
  if (t.ch !== '\n') voiceBlip(typingVoice, t.ch);
  typingIndex++;
}

function appendToken(container, t) {
  if (t.ch === '\n') {
    container.appendChild(document.createElement('br'));
    return;
  }
  if (t.cls.length) {
    const span = document.createElement('span');
    span.className = t.cls.join(' ');
    span.textContent = t.ch;
    container.appendChild(span);
  } else {
    container.appendChild(document.createTextNode(t.ch));
  }
}

function finishTyping() {
  clearInterval(typingTimer);
  isTyping = false;
  setChoicesEnabled(true);
}

function skipTyping() {
  if (!isTyping) return;
  clearInterval(typingTimer);
  const storyText = document.getElementById('storyText');
  storyText.innerHTML = '';
  for (let k = 0; k < typingTokens.length; k++) {
    appendToken(storyText, typingTokens[k]);
  }
  finishTyping();
}

function setChoicesEnabled(enabled) {
  const btns = document.querySelectorAll('.choiceBtn');
  btns.forEach(b => { b.disabled = !enabled; });
}

/* ===================== НАВИГАЦИЯ ПО СЦЕНАМ ===================== */
function goToScene(sceneId) {
  const scene = scenes[sceneId];
  state.sceneId = sceneId;

  if (typeof scene.onEnter === 'function') {
    scene.onEnter(state.heroId, state.flags);
  }

  drawIllustration(scene.illustration);

  let rawText = typeof scene.text === 'function' ? scene.text() : scene.text;
  if (state.heroId) rawText = rawText.split('{heroName}').join(HEROES[state.heroId].name);

  document.getElementById('choicesPanel').style.display = 'block';
  const choicesWrap = document.getElementById('choices');
  const restartWrap = document.getElementById('restartWrap');
  choicesWrap.innerHTML = '';

  if (scene.ending) {
    restartWrap.style.display = 'block';
  } else {
    restartWrap.style.display = 'none';
    scene.choices.forEach(choice => {
      if (choice.requiresFlag && !state.flags[choice.requiresFlag]) return;
      if (choice.requiresNotFlag && state.flags[choice.requiresNotFlag]) return;
      const btn = document.createElement('button');
      btn.className = 'choiceBtn';
      btn.textContent = choice.text;
      btn.disabled = true;
      btn.addEventListener('click', () => {
        ensureAudio();
        goToScene(choice.next);
      });
      choicesWrap.appendChild(btn);
    });
  }

  startTyping(rawText, scene.voice);
}

document.getElementById('restartBtn').addEventListener('click', () => {
  state.heroId = null;
  state.sceneId = null;
  state.flags = {};
  showCharSelect();
});

document.getElementById('storyText').addEventListener('click', skipTyping);

/* ===================== ЭКРАН ВЫБОРА ПЕРСОНАЖА ===================== */
function showCharSelect() {
  document.getElementById('charSelectWrap').style.display = 'block';
  document.getElementById('storyWrap').style.display = 'none';
  document.getElementById('choicesPanel').style.display = 'none';
  drawIllustration('select_default');

  const wrap = document.getElementById('charSelect');
  wrap.innerHTML = '';
  Object.values(HEROES).forEach(hero => {
    const card = document.createElement('div');
    card.className = 'charCard';
    const cv = document.createElement('canvas');
    cv.width = 32; cv.height = 32;
    card.appendChild(cv);
    const h3 = document.createElement('h3');
    h3.textContent = hero.name;
    card.appendChild(h3);
    const p = document.createElement('p');
    p.textContent = hero.desc;
    card.appendChild(p);
    card.addEventListener('click', () => {
      ensureAudio();
      state.heroId = hero.id;
      state.flags = {};
      document.getElementById('charSelectWrap').style.display = 'none';
      document.getElementById('storyWrap').style.display = 'block';
      goToScene('intro');
    });
    wrap.appendChild(card);
    hero.portrait(cv.getContext('2d'));
  });
}

/* ===================== ПИКСЕЛЬ-АРТ (низкое разрешение + pixelated) ===================== */
function px(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}
function clearArt(ctx, bg) {
  ctx.clearRect(0, 0, 32, 32);
  px(ctx, 0, 0, 32, 32, bg || '#12131a');
}

function drawPortraitMark(ctx) {
  clearArt(ctx, '#141922');
  px(ctx, 10, 6, 12, 10, '#4a7c59');
  px(ctx, 8, 16, 16, 10, '#3d6b4a');
  px(ctx, 11, 9, 2, 2, '#ffffff');
  px(ctx, 19, 9, 2, 2, '#ffffff');
  px(ctx, 12, 4, 3, 3, '#2b2b2b');
  px(ctx, 17, 4, 3, 3, '#2b2b2b');
  px(ctx, 9, 20, 5, 3, '#1c1c1c');
  px(ctx, 18, 20, 5, 3, '#1c1c1c');
}
function drawPortraitDrosip(ctx) {
  clearArt(ctx, '#161512');
  px(ctx, 10, 7, 12, 10, '#a8b23f');
  px(ctx, 8, 17, 16, 9, '#8f992f');
  px(ctx, 11, 10, 2, 2, '#1a1a1a');
  px(ctx, 19, 10, 2, 2, '#1a1a1a');
  px(ctx, 8, 5, 3, 5, '#7d8a2a');
  px(ctx, 21, 5, 3, 5, '#7d8a2a');
  px(ctx, 12, 22, 8, 3, '#d9c25c');
}
function drawPortraitDonimazik(ctx) {
  clearArt(ctx, '#1a1420');
  px(ctx, 9, 8, 14, 10, '#e0b98a');
  px(ctx, 7, 18, 18, 9, '#caa26f');
  px(ctx, 12, 11, 2, 2, '#2a2a2a');
  px(ctx, 18, 11, 2, 2, '#2a2a2a');
  px(ctx, 13, 21, 6, 4, '#f4f2e6');
  px(ctx, 13, 21, 6, 2, '#ffe27a');
  px(ctx, 22, 18, 4, 6, '#f4f2e6');
}

function drawArtCanvas(fn) {
  const canvas = document.getElementById('artCanvas');
  const ctx = canvas.getContext('2d');
  clearArt(ctx, '#12131a');
  fn(ctx);
}

  px(ctx, 21, 4, 5, 4, '#3f5a2f');
  px(ctx, 14, 18, 4, 4, '#ff8c3b');
  px(ctx, 15, 16, 2, 2, '#ffd166');

}

  px(ctx, 14, 13, 5, 4, '#8fd6ff');
  px(ctx, 21, 13, 4, 4, '#8fd6ff');
  px(ctx, 7, 23, 4, 4, '#1a1a1a');
  px(ctx, 20, 23, 4, 4, '#1a1a1a');

  px(ctx, 0, 0, 32, 32, '#0f1a12');
  px(ctx, 12, 18, 8, 8, '#ffd166');
  px(ctx, 10, 16, 12, 3, '#e8b93a');
  px(ctx, 14, 26, 4, 2, '#8a6a1a');
  px(ctx, 15, 6, 2, 2, '#ffe27a');
  px(ctx, 8, 9, 2, 2, '#8fd6ff');
  px(ctx, 22, 9, 2, 2, '#8fd6ff');
  px(ctx, 5, 4, 2, 2, '#ff9de2');
  px(ctx, 25, 4, 2, 2, '#ff9de2');
}

function drawPocketsItem(ctx) {
  px(ctx, 0, 0, 32, 32, '#12131a');
  const hero = HEROES[state.heroId];
  if (!hero) { px(ctx, 12, 12, 8, 8, '#ffd166'); return; }
  if (hero.id === 'mark') {
    px(ctx, 9, 14, 14, 8, '#3a3a3a');
    px(ctx, 12, 12, 8, 3, '#555');
    px(ctx, 22, 17, 6, 1, '#888');
  } else if (hero.id === 'drosip') {
    px(ctx, 8, 10, 16, 14, '#e8e6df');
    px(ctx, 10, 14, 12, 1, '#8a8a8a');
    px(ctx, 10, 17, 12, 1, '#8a8a8a');
    px(ctx, 10, 20, 8, 1, '#8a8a8a');
  } else {
    px(ctx, 11, 8, 10, 16, '#f4f2e6');
    px(ctx, 11, 8, 10, 4, '#ffe27a');
    px(ctx, 13, 14, 6, 6, '#f7f0d0');
  }
}

const ILLUSTRATIONS = {
  select_default: drawVictory,
  intro_forest: drawIntroForest,
  bus_scene: drawBus,
  tavern_scene: drawTavern,
  bureaucrat_scene: drawBureaucrat,
  boss_scene: drawBoss,
  gameover_scene: drawGameOver,
  victory_scene: drawVictory,
  pockets_item: drawPocketsItem
};

function drawIllustration(key) {
  const fn = ILLUSTRATIONS[key] || drawIntroForest;
  drawArtCanvas(fn);
}

showCharSelect();
